name: ci

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  workflow_dispatch:

env:
    IMAGE_NAME: dreams-ui
    DOCKER_USERNAME: bbrighter

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    
    - name: pnpm
      uses: pnpm/action-setup@v4
      
    - name: Use node
      uses: actions/setup-node@v6
      with:
        node-version: 24.3.0
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install

    - name: Typescript
      run: pnpm tsc

    - name: Lint
      run: pnpm run lint 

    - name: Knip
      run: pnpm run knip

    - name: Dependency cruiser
      run: pnpm dependencies:ci

    - name: Test
      run: pnpm test

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && success()
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    
    - name: pnpm
      uses: pnpm/action-setup@v4

    - name: Use node
      uses: actions/setup-node@v6
      with:
        node-version: 24.3.0
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install

    - name: Build
      run: pnpm build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist
        retention-days: 1

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && success()
    runs-on: ubuntu-24.04

    steps:   
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download build
      uses: actions/download-artifact@v4
      with: 
        name: dist
        path: dist

    - name: Debug build context
      run: ls -la

    - name: Log in to Docker
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: bbrighter/${{ env.IMAGE_NAME }}

    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/arm64
        cache-from: type=registry,ref=bbrighter/${{ env.IMAGE_NAME }}:cache
        cache-to: type=registry,ref=bbrighter/${{ env.IMAGE_NAME }}:cache


