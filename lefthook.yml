pre-commit:
  parallel: true
  jobs:
    - name: Lint
      run: pnpm lint
    - name: Typescript
      run: pnpm tsc
    - name: Detect deadcode
      run: pnpm knip
    - name: Format
      run: pnpm fmt:check
    - name: Dependencies
      run: pnpm dependencies:ci
    - name: Licenses
      run: pnpm licenses:check

pre-push:
  jobs:
    - name: Test
      run: pnpm test:once
